<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Índice Técnico SNIEr · Prototipo funcional</title>
<style>
:root{
  --guinda:#691C32; --guinda-claro:#9C2348; --guinda-oscuro:#4A1424;
  --verde:#235B4E; --dorado:#BC955C; --dorado-oscuro:#A57F2C;
  --gris:#6F7271; --gris-claro:#98989A;
  --tinta:#2B2B2B; --papel:#F7F4F1; --panel:#FFFFFF;
  --linea:#DED7D1; --arena:#EDE7E3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans","Montserrat","Segoe UI",system-ui,sans-serif; background:var(--papel); color:var(--tinta); font-size:15px}
button{font-family:inherit}

.marco{max-width:1080px; margin:0 auto 30px; padding:22px 16px 0}
.tira{background:var(--panel); border-bottom:3px solid var(--guinda)}
.tira .interior{max-width:1080px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px}
.tira img{display:block; height:56px; width:auto}
.tira .sistema{border-left:1px solid var(--linea); padding-left:18px; font-size:13px; color:var(--guinda); font-weight:600; line-height:1.35}
.tira .sistema span{display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--gris); font-weight:400; margin-top:2px}
@media(max-width:560px){
  .tira img{height:44px}
  .tira .sistema{font-size:12px; padding-left:12px}
}
.rotulo{font-size:11px; letter-spacing:1.1px; text-transform:uppercase; color:var(--gris); margin:16px 0 8px}
.app{background:var(--panel); border:1px solid var(--linea); border-radius:10px; overflow:hidden}

/* ---- barra ---- */
.barra{background:var(--guinda); display:flex; align-items:stretch; gap:14px; padding:0 18px}
.barra .marca{color:#fff; font-size:15px; font-weight:600; padding:15px 22px 13px 0; border-right:1px solid rgba(255,255,255,.24); margin-right:6px; display:flex; align-items:center; cursor:pointer; background:none; border-left:0; border-top:0; border-bottom:0}
.barra .marca:hover{color:var(--dorado)}
.pest{color:#E9D9DE; font-size:12.5px; padding:16px 2px 13px; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-left:0; border-right:0; border-top:0}
.pest:hover{color:#fff}
.pest.on{color:#fff; font-weight:600; border-bottom-color:var(--dorado)}
.pest:focus-visible{outline:2px solid var(--dorado); outline-offset:-3px}
.art69{display:inline-flex; align-items:center; gap:6px; font-size:12px; margin-left:auto; align-self:center; text-decoration:none;
  color:#fff; font-weight:600; padding:6px 11px; border:1.5px solid var(--dorado); border-radius:6px; white-space:nowrap}
.art69:hover{background:var(--dorado); color:var(--guinda-oscuro)}
.art69:focus-visible{outline:2px solid var(--dorado); outline-offset:2px}
.art69 svg{flex:0 0 auto}
.busca{margin-left:12px; flex:0 0 auto; display:flex; align-items:center; padding:9px 0}
.busca input{font:inherit; font-size:12.5px; padding:6px 10px; width:118px; border:1px solid rgba(255,255,255,.3); border-radius:5px; background:rgba(255,255,255,.14); color:#fff}
.busca input::placeholder{color:#D9C3CA}
.busca input:focus{outline:2px solid var(--dorado); outline-offset:1px; background:rgba(255,255,255,.22)}

/* ---- migas ---- */
.migas{padding:11px 22px; border-bottom:1px solid var(--linea); font-size:12.5px; color:var(--gris); background:var(--panel); display:flex; align-items:center; flex-wrap:wrap}
.migas a{color:var(--guinda); text-decoration:none; cursor:pointer}
.migas a:hover{text-decoration:underline; color:var(--guinda-claro)}
.migas .aqui{color:var(--tinta)}
.migas span.sep{margin:0 7px; color:var(--gris-claro)}

.lienzo{padding:20px 22px}

/* ---- portada: menú circular ---- */
.portada{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:center}
.dona{display:block; width:100%; max-width:560px; margin:0 auto}
.gajo{cursor:pointer}
.gajo path.velo{transition:fill-opacity .18s}
.gajo:focus-visible{outline:none}
.gajo-t{pointer-events:none; font-weight:700; letter-spacing:.2px}

.ficha{border-left:3px solid var(--dorado); padding:2px 0 2px 16px}
.ficha .eti{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gris-claro)}
.ficha h2{font-size:21px; margin:5px 0 8px; color:var(--guinda); font-weight:600; line-height:1.2}
.ficha p{font-size:13px; line-height:1.6; color:var(--gris); margin:0 0 14px}
.cifras{display:flex; gap:18px; margin-bottom:16px}
.cifra b{display:block; font-size:20px; color:var(--tinta); font-weight:600; line-height:1}
.cifra span{font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--gris-claro)}
.entrar{background:var(--guinda); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:13px; cursor:pointer}
.entrar:hover{background:var(--guinda-claro)}
.entrar:disabled{background:var(--gris-claro); cursor:default}

/* ---- portada / cabecera de sector ---- */
.hero{position:relative; border-radius:10px; overflow:hidden; margin-bottom:20px; min-height:132px; display:flex; align-items:flex-end; background:var(--guinda)}
.hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero .capa{position:absolute; inset:0; background:linear-gradient(90deg, rgba(74,20,36,.92) 0%, rgba(74,20,36,.72) 55%, rgba(74,20,36,.30) 100%)}
.hero .txt{position:relative; padding:18px 22px; color:#fff}
.hero h1{font-size:24px; margin:0 0 5px; font-weight:600}
.hero p{margin:0; font-size:12.5px; color:#EAD9DE; max-width:640px; line-height:1.55}
.hero .marcas{position:relative; margin-left:auto; padding:0 22px 18px; text-align:right; color:#E6D194; font-size:11px; letter-spacing:.8px; text-transform:uppercase; white-space:nowrap}

/* ---- rejilla de temas / cadenas ---- */
.rejilla{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 34px}
.tema{border-bottom:1px solid var(--linea); padding:16px 0; display:flex; gap:14px; cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; text-align:left; font:inherit; color:inherit; width:100%}
.tema:hover .tnom{color:var(--guinda-claro); text-decoration:underline}
.tema:hover .aro{background:var(--arena)}
.tema:focus-visible{outline:2px solid var(--guinda); outline-offset:2px}
.aro{flex:0 0 42px; height:42px; border-radius:50%; border:1.5px solid var(--guinda); display:flex; align-items:center; justify-content:center; color:var(--guinda)}
.tnom{color:var(--guinda); font-size:15.5px; font-weight:600}
.tdesc{color:var(--gris); font-size:12.5px; line-height:1.5; margin-top:3px}
.tconteo{display:block; margin-top:5px; font-size:11px; color:var(--gris-claro); letter-spacing:.4px}

.cadenas{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.cad{border:1px solid var(--linea); border-radius:10px; overflow:hidden; background:none; padding:0; text-align:left; cursor:pointer; color:inherit; display:block}
.cad:hover{border-color:var(--guinda); box-shadow:0 2px 10px rgba(105,28,50,.12)}
.cad:focus-visible{outline:2px solid var(--guinda); outline-offset:2px}
.cad .foto{display:block; position:relative; height:118px; overflow:hidden}
.cad .foto img{width:100%; height:100%; object-fit:cover; display:block}
.cad .foto .rot{position:absolute; left:0; bottom:0; background:var(--guinda); color:#fff; font-size:13px; font-weight:600; padding:5px 12px; border-top-right-radius:6px}
.cad .cuerpo{display:block; padding:12px 14px 14px}
.cad .cuerpo .desc{display:block; font-size:12.5px; color:var(--gris); line-height:1.5}
.cad .cuerpo .tconteo{margin-top:8px}

/* ---- vista de tema ---- */
.dos{display:grid; grid-template-columns:200px minmax(0,1fr)}
.lat{border-right:1px solid var(--linea); padding:18px 0}
.lat .cab{font-size:10.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--gris-claro); padding:0 16px 9px}
.lat button{display:block; width:100%; text-align:left; font:inherit; font-size:12.5px; padding:6px 16px; border:0; border-left:3px solid transparent; background:none; color:var(--gris); cursor:pointer; line-height:1.35}
.lat button:hover{background:var(--papel); color:var(--guinda)}
.lat button.on{border-left-color:var(--guinda); color:var(--guinda); font-weight:600}
.lat button:focus-visible{outline:2px solid var(--guinda); outline-offset:-2px}
.cabtema{display:flex; align-items:flex-start; gap:14px}
.cabtema h2{font-size:20px; font-weight:600; margin:0; color:var(--tinta)}
.subs{margin-top:18px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.sub{border:1px solid var(--linea); border-radius:8px; padding:13px 14px; color:var(--guinda); font-size:13.5px; font-weight:600; line-height:1.4; background:var(--panel); text-align:left; cursor:pointer; display:block; width:100%}
.sub:hover{border-color:var(--guinda); background:#FCF9F8}
.sub:focus-visible{outline:2px solid var(--guinda); outline-offset:2px}
.sub .folio{display:block; color:var(--gris-claro); font-size:11px; font-weight:400; margin-top:4px}
.sub .cuenta{color:var(--verde); font-weight:600}
.sub .cuenta.cero{color:var(--gris-claro); font-weight:400; font-style:italic}
.sub.marca{border-left:4px solid var(--dorado)}

.vacio{border:1.5px dashed var(--linea); border-radius:10px; padding:44px 24px; text-align:center; color:var(--gris)}
.vacio strong{display:block; font-size:15px; color:var(--tinta); margin-bottom:5px; font-weight:600}
.vacio span{font-size:13px}

/* ---- resultados ---- */
.res h2{font-size:16px; font-weight:600; margin:0 0 12px}
.res .fila{border-bottom:1px solid var(--linea); padding:11px 0; cursor:pointer; width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0}
.res .fila:hover .rn{text-decoration:underline; color:var(--guinda-claro)}
.rn{color:var(--guinda); font-size:14px; font-weight:600}
.rr{color:var(--gris); font-size:12px; margin-top:2px}
.rt{display:inline-block; font-size:10px; letter-spacing:.8px; text-transform:uppercase; color:var(--verde); border:1px solid var(--verde); border-radius:3px; padding:1px 6px; margin-right:8px}
.sinres{color:var(--gris); font-size:13.5px; padding:18px 0}

/* ---- cajón de detalle ---- */
.fondo{position:fixed; inset:0; background:rgba(43,43,43,.42); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40}
.fondo.on{opacity:1; pointer-events:auto}
.cajon{position:fixed; top:0; right:0; height:100%; width:min(520px,94vw); background:var(--panel); z-index:41; transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-6px 0 24px rgba(0,0,0,.18)}
.cajon.on{transform:translateX(0)}
.cajon header{background:var(--guinda); color:#fff; padding:16px 20px; position:relative}
.cajon header .ruta{font-size:11px; color:#E1C8D0; letter-spacing:.4px; margin-bottom:6px; padding-right:26px}
.cajon header h3{margin:0; font-size:17px; font-weight:600; line-height:1.3; padding-right:26px}
.cajon header .folio{display:block; margin-top:6px; font-size:11px; color:#E6D194; letter-spacing:.8px; text-transform:uppercase}
.cerrar{position:absolute; top:12px; right:12px; background:none; border:0; color:#fff; font-size:20px; line-height:1; cursor:pointer; padding:4px 8px; border-radius:4px}
.cerrar:hover{background:rgba(255,255,255,.16)}
.cajon.ancho{width:min(940px,96vw)}
.cajon .cuerpo{overflow:auto; padding:16px 20px 28px}

/* --- geovisualizador --- */
.visor{display:grid; grid-template-columns:176px minmax(0,1fr); gap:16px; align-items:start}
.vtit{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gris-claro); margin-bottom:7px}
.vcapa{display:block; width:100%; text-align:left; font:inherit; font-size:12.5px; line-height:1.35; padding:7px 9px;
  margin-bottom:5px; border:1px solid var(--linea); border-radius:6px; background:var(--panel); color:var(--gris); cursor:pointer}
.vcapa:hover{border-color:var(--guinda); color:var(--guinda)}
.vcapa.on{background:var(--guinda); border-color:var(--guinda); color:#fff; font-weight:600}
.vcapa:focus-visible{outline:2px solid var(--guinda); outline-offset:2px}
.vvar{margin-top:12px}
.vvar label{display:block; font-size:10.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--gris-claro); margin-bottom:4px}
.vvar select{width:100%; font:inherit; font-size:12.5px; padding:5px 7px; border:1px solid var(--linea); border-radius:5px; background:var(--panel); color:var(--tinta)}
.vvar input[type=range]{width:100%; accent-color:var(--guinda)}
.vmapa canvas{width:100%; height:auto; display:block; border:1px solid var(--linea); border-radius:8px; background:#F5FAFC; cursor:crosshair}
.vleyenda{margin-top:9px}
.vlg-b{height:11px; border-radius:3px; border:1px solid var(--linea)}
.vlg-t{display:flex; justify-content:space-between; font-size:11px; color:var(--gris); margin-top:3px}
.vlg-cl{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--gris)}
.vlg-cl i{display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:5px; vertical-align:-2px; border:1px solid rgba(0,0,0,.12)}
.vlg-pt{display:inline-block; width:11px; height:11px; border-radius:50%; background:#C0392B; border:1.4px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.15); margin-right:6px; vertical-align:-1px}
.vleyenda{font-size:11px; color:var(--gris)}
.vpie{display:flex; justify-content:space-between; gap:12px; margin-top:8px; font-size:11.5px; color:var(--gris); border-top:1px solid var(--linea); padding-top:7px}
.vpie #vconteo{color:var(--guinda); font-weight:600; white-space:nowrap}
.vnota{font-size:11.5px; color:var(--gris-claro); line-height:1.5; margin:12px 0 0}
.vtitreg{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gris-claro); margin:20px 0 2px; border-top:1px solid var(--linea); padding-top:14px}
@media(max-width:720px){ .visor{grid-template-columns:1fr} }
.reg{border-bottom:1px solid var(--linea); padding:13px 0}
.reg:last-child{border-bottom:0}
.reg .num{font-size:10.5px; color:var(--gris-claro); letter-spacing:.8px}
.reg p{margin:3px 0 8px; font-size:13.5px; line-height:1.5; color:var(--tinta)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:11px; border:1px solid var(--linea); border-radius:4px; padding:2px 8px; color:var(--gris); background:var(--papel)}
.chip b{color:var(--tinta); font-weight:600}
.chip.art{border-color:var(--dorado-oscuro); color:var(--dorado-oscuro)}

.pie{max-width:1080px; margin:16px auto 34px; padding:0 16px; color:var(--gris); font-size:12px; line-height:1.6; display:flex; justify-content:flex-end; gap:16px; flex-wrap:wrap}
.pie b{color:var(--tinta); font-weight:600}
.pie .sello{color:var(--guinda); font-weight:600; letter-spacing:.5px; white-space:nowrap}

@media(max-width:860px){
  .portada{grid-template-columns:1fr}
  .cadenas{grid-template-columns:1fr}
}
@media(max-width:760px){
  .rejilla,.subs{grid-template-columns:1fr}
  .dos{grid-template-columns:1fr}
  .lat{border-right:0; border-bottom:1px solid var(--linea)}
  .barra{flex-wrap:wrap; gap:10px; padding:0 16px 10px}
  #pestanas{flex-wrap:wrap; row-gap:0; column-gap:16px !important}
  .pest{padding:8px 0 6px; font-size:13px}
  .barra .marca{padding:13px 16px 11px 0}
  .busca{padding:4px 0 6px; margin-left:0}
  .art69{margin-left:auto}
  .busca input{width:100%; min-width:160px}
  .hero .marcas{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="tira">
  <div class="interior">
    <img id="logotira" alt="Secretaría de Energía">
    <div class="sistema">Sistema Nacional de Información Energética<span>Índice Técnico</span></div>
  </div>
</div>

<div class="marco">
  <div class="app">
    <div class="barra">
      <button class="marca" id="inicio">SNIEr Técnico</button>
      <div id="pestanas" style="display:flex; gap:12px; flex-wrap:wrap; flex:1 1 auto; min-width:0"></div>
      <a class="art69" href="https://sener-spte.com/SNIEr/menu-secciones1Propuesta.html"
         title="Regresar al contenido del Artículo 69">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Art. 69
      </a>
      <div class="busca">
        <input id="q" type="search" placeholder="Buscar" aria-label="Buscar en el índice" autocomplete="off">
      </div>
    </div>

    <nav class="migas" id="migas" aria-label="Ruta de navegación"></nav>

    <div class="lienzo" id="lienzo"></div>
  </div>
</div>

<div class="pie">
  <span class="sello">SNIEr | SPTE - SENER</span>
</div>

<div class="fondo" id="fondo"></div>
<aside class="cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cajontit" aria-hidden="true">
  <header>
    <div class="ruta" id="cajonruta"></div>
    <h3 id="cajontit"></h3>
    <span class="folio" id="cajonfolio"></span>
    <button class="cerrar" id="cerrar" aria-label="Cerrar detalle">&times;</button>
  </header>
  <div class="cuerpo" id="cajoncuerpo"></div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* grupo = sector completo, o una cadena dentro del sector */
function grupos(sec){
  return sec.cadenas ? sec.cadenas : [{nombre:null, temas:sec.temas}];
}
function grupoActual(){
  const s = D[vista.sec];
  return s.cadenas ? s.cadenas[vista.cad] : {nombre:null, temas:s.temas};
}
function contarTema(t){
  return t.subs.reduce((a,u)=>a+u.regs.length,0);
}

let vista = {n:0, sec:null, cad:null, tema:null};

/* ---------- barra y migas ---------- */

  $('pestanas').innerHTML = D.map((s,i) =>

function pintarMigas(){

  else{
    const s = D[vista.sec];
    h = '<a data-ir="0">Inicio</a><span class="sep">›</span>';
    if(vista.n===1) h += '<span class="aqui">'+esc(s.nombre)+'</span>';
    else{
      h += '<a data-ir="1">'+esc(s.nombre)+'</a><span class="sep">›</span>';

      if(vista.n===2) h += '<span class="aqui">'+esc(cad.nombre)+'</span>';

    if(d==='0') irInicio(); else if(d==='1') irSector(vista.sec); else irCadena(vista.cad);

}

/* ---------- nivel 1: menú circular ---------- */
function polar(cx,cy,r,g){ const a=(g-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function gajoPath(cx,cy,R,r,g1,g2){
  const [x1,y1]=polar(cx,cy,R,g1), [x2,y2]=polar(cx,cy,R,g2);
  const [x3,y3]=polar(cx,cy,r,g2), [x4,y4]=polar(cx,cy,r,g1);
  const big = (g2-g1)>180 ? 1 : 0;
  return `M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z`;
}

function pintarPortada(){
  const cx=300, cy=300, R=212, r=104, hueco=1.6;
  const paso = 360/D.length;

  // cada gajo enseña el centro de su fotografía: el patrón se ancla en el centroide del gajo
  const S = 330;
  let defs = '', g = '';
  ORDEN_DONA.forEach((si,pos) => {
    const s = D[si];
    const g1 = pos*paso + hueco/2, g2 = (pos+1)*paso - hueco/2, gm = (g1+g2)/2;
    const [px,py] = polar(cx,cy,(R+r)/2,gm);
    defs += '<pattern id="pat'+si+'" patternUnits="userSpaceOnUse" x="'+(px-S/2)+'" y="'+(py-S/2)+'" width="'+S+'" height="'+S+'">'+
            '<image href="'+IMG[s.img]+'" width="'+S+'" height="'+S+'" preserveAspectRatio="xMidYMid slice"/></pattern>';
    const d = gajoPath(cx,cy,R,r,g1,g2);
    const lin = LINEAS[s.nombre] || [s.nombre];
    const y0 = py - (lin.length-1)*10;
    g += '<g class="gajo" tabindex="0" role="button" data-s="'+si+'" aria-label="'+esc(s.nombre)+'">';
    g += '<path d="'+d+'" fill="url(#pat'+si+')"/>';
    g += '<path class="velo" d="'+d+'" fill="#4A1424" fill-opacity=".54" stroke="#FFFFFF" stroke-width="2"/>';
    lin.forEach((t,k) => g += '<text class="gajo-t" x="'+px+'" y="'+(y0+k*19)+'" text-anchor="middle" fill="#FFFFFF" font-size="15.5">'+esc(t)+'</text>');
    g += '</g>';
  });
  defs = '<defs>' + defs + '</defs>';

  const svg = '<svg class="dona" viewBox="76 76 448 448" role="img" aria-label="Menú circular de los cinco sectores del índice">'+
    defs + g +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-4)+'" fill="#691C32"/>'+
    '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700" letter-spacing="1">SNIEr</text>'+
    '<text x="'+cx+'" y="'+(cy+23)+'" text-anchor="middle" fill="#E6D194" font-size="11.5" letter-spacing="2.2">ÍNDICE TÉCNICO</text>'+
    '</svg>';

  $('lienzo').innerHTML = '<div class="portada"><div>'+svg+'</div><div class="ficha" id="ficha"></div></div>';

  let fijo = null;
  const ficha = (i) => {
    if(i===null){
      $('ficha').innerHTML = '<div class="eti">Nivel 1 · sectores</div>'+
        '<h2>Elige un sector</h2>'+
        '<p>El menú circular abre el primer nivel del índice. Cada sector agrupa sus temas y subtemas; '+
        'hidrocarburos añade la cadena de valor como nivel intermedio.</p>'+
        '<div class="cifras"><div class="cifra"><b>'+D.length+'</b><span>Sectores</span></div>'+
        '<div class="cifra"><b>'+D.reduce((a,s)=>a+s.stats.temas,0)+'</b><span>Temas</span></div>'+
        '<div class="cifra"><b>'+D.reduce((a,s)=>a+s.stats.subs,0)+'</b><span>Subtemas</span></div></div>';
      return;
    }
    const s = D[i];
    $('ficha').innerHTML = '<div class="eti">Sector '+(i+1)+' de '+D.length+'</div>'+
      '<h2>'+esc(s.nombre)+'</h2><p>'+esc(RESUMEN[s.nombre]||'')+'</p>'+
      '<div class="cifras">'+
        (s.cadenas ? '<div class="cifra"><b>'+s.cadenas.length+'</b><span>Cadenas</span></div>' : '')+
        '<div class="cifra"><b>'+s.stats.temas+'</b><span>Temas</span></div>'+
        '<div class="cifra"><b>'+s.stats.subs+'</b><span>Subtemas</span></div>'+
        '<div class="cifra"><b>'+s.stats.regs+'</b><span>Registros</span></div></div>'+
      '<button class="entrar" data-s="'+i+'">Entrar al sector ›</button>';
    const b = $('ficha').querySelector('.entrar');
    if(b) b.onclick = () => irSector(i);
  };
  ficha(null);

  $('lienzo').querySelectorAll('.gajo').forEach(gj => {
    const velo = gj.querySelector('.velo');
    const i = +gj.dataset.s;
    const on = () => { velo.setAttribute('fill-opacity','.14'); ficha(i); };
    const off = () => { velo.setAttribute('fill-opacity','.54'); ficha(fijo); };
    gj.addEventListener('mouseenter', on);
    gj.addEventListener('mouseleave', off);
    gj.addEventListener('focus', on);
    gj.addEventListener('blur', off);
    gj.addEventListener('click', () => irSector(i));
    gj.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); irSector(i); } });
  });
}

/* ---------- cabecera con foto ---------- */
function hero(titulo, texto, imgKey, sello){
  return '<div class="hero"><img src="'+IMG[imgKey]+'" alt=""><div class="capa"></div>'+
    '<div class="txt"><h1>'+esc(titulo)+'</h1><p>'+esc(texto)+'</p></div>'+
    '<div class="marcas">'+esc(sello)+'</div></div>';
}

/* ---------- nivel 2: sector ---------- */
function tarjetasTemas(temas){
  return '<div class="rejilla">' + temas.map((t,i) => {
    const nr = contarTema(t);
    const uni = t.subs.length && t.subs.every(u=>u.visor) ? ['capa','capas'] : ['registro','registros'];
    return '<button class="tema" data-t="'+i+'"><span class="aro">'+svgIcono(t.icono,21)+'</span>'+
      '<span><span class="tnom">'+esc(t.nombre)+' ›</span>'+
      '<span class="tdesc" style="display:block">'+esc(t.desc)+'</span>'+
      '<span class="tconteo">'+plural(t.subs.length,'subtema','subtemas')+' · '+plural(nr,uni[0],uni[1])+'</span></span></button>';
  }).join('') + '</div>';
}

function pintarSector(){
  const s = D[vista.sec];
  let h = hero(s.nombre, RESUMEN[s.nombre]||'', s.img, (s.cadenas?'4 niveles':'3 niveles'));

  if(s.cadenas){
    h += '<div class="rotulo" style="margin:0 0 12px">Nivel 2 · cadena de valor</div><div class="cadenas">' +
      s.cadenas.map((c,i) => {
        const ns = c.temas.reduce((a,t)=>a+t.subs.length,0);
        const nr = c.temas.reduce((a,t)=>a+contarTema(t),0);
        return '<button class="cad" data-c="'+i+'"><span class="foto"><img src="'+IMG[c.img]+'" alt=""><span class="rot">'+esc(c.nombre)+'</span></span>'+
          '<span class="cuerpo"><span class="desc">'+esc(c.desc)+'</span><span class="tconteo">'+plural(c.temas.length,'tema','temas')+' · '+
          plural(ns,'subtema','subtemas')+' · '+plural(nr,'registro','registros')+'</span></span></button>';
      }).join('') + '</div>';
    $('lienzo').innerHTML = h;
    $('lienzo').querySelectorAll('.cad').forEach(b => b.onclick = () => irCadena(+b.dataset.c));
    return;
  }
  if(!s.temas.length){
    $('lienzo').innerHTML = h + '<div class="vacio"><strong>Sin temas cargados</strong><span>Este sector todavía no tiene temas ni subtemas en el índice.</span></div>';
    return;
  }
  $('lienzo').innerHTML = h + tarjetasTemas(s.temas);
  $('lienzo').querySelectorAll('.tema').forEach(b => b.onclick = () => irTema(+b.dataset.t));
}

/* ---------- nivel 3 (hidrocarburos): cadena ---------- */
function pintarCadena(){
  const s = D[vista.sec], c = s.cadenas[vista.cad];
  $('lienzo').innerHTML = hero(s.nombre+' · '+c.nombre, c.desc, c.img, 'Cadena de valor') + tarjetasTemas(c.temas);
  $('lienzo').querySelectorAll('.tema').forEach(b => b.onclick = () => irTema(+b.dataset.t));
}

/* ---------- último nivel: tema y subtemas ---------- */
function pintarTema(){
  const s = D[vista.sec], g = grupoActual(), t = g.temas[vista.tema];
  let h = '<div class="dos"><div class="lat"><div class="cab">'+(g.nombre?esc(g.nombre):'Temas')+'</div>';
  h += g.temas.map((x,i)=>'<button class="'+(i===vista.tema?'on':'')+'" data-t="'+i+'">'+esc(x.nombre)+'</button>').join('');
  h += '</div><div style="padding:20px 22px">';
  h += '<div class="cabtema"><span class="aro" style="flex:0 0 44px;height:44px">'+svgIcono(t.icono,22)+'</span>'+
       '<div><h2>'+esc(t.nombre)+'</h2><div class="tdesc">'+esc(t.desc)+'</div></div></div>';
  h += '<div class="subs">' + t.subs.map((u,i) => {
        const n = u.regs.length;
        return '<button class="sub'+(n?' marca':'')+'" data-u="'+i+'">'+esc(u.nombre)+
          '<span class="folio">'+esc(u.folio||('Subtema '+u.n))+' · <span class="cuenta'+(n?'':' cero')+'">'+
          (n?plural(n,u.visor?'capa':'registro',u.visor?'capas':'registros'):'sin registros')+'</span></span></button>';
      }).join('') + '</div></div></div>';
  $('lienzo').innerHTML = h;
  $('lienzo').querySelectorAll('.lat button').forEach(b => b.onclick = () => irTema(+b.dataset.t));
  $('lienzo').querySelectorAll('.sub').forEach(b => b.onclick = () => abrirSub(+b.dataset.u));
}

/* ---------- cajón de registros ---------- */
let ultimoFoco = null;
function abrirSub(i){
  const s = D[vista.sec], g = grupoActual(), t = g.temas[vista.tema], u = t.subs[i];
  ultimoFoco = document.activeElement;
  $('cajonruta').textContent = [s.nombre, g.nombre, t.nombre].filter(Boolean).join(' › ');
  $('cajontit').textContent = u.nombre;
  $('cajonfolio').textContent = (u.folio || ('Subtema ' + u.n)) + ' · ' +
    (u.visor ? plural(u.regs.length,'capa','capas') : plural(u.regs.length,'registro','registros'));
  $('cajon').classList.toggle('ancho', !!u.visor);
  $('cajoncuerpo').innerHTML = (u.visor ? htmlVisor() + '<div class="vtitreg">Capas publicadas</div>' : '') +
    (u.regs.length
    ? u.regs.map((r,k) => {
        let ch = '';
        if(r.fuente) ch += '<span class="chip">Fuente <b>'+esc(r.fuente)+'</b></span>';
        if(r.periodicidad) ch += '<span class="chip">Periodicidad <b>'+esc(r.periodicidad)+'</b></span>';
        if(r.unidades) ch += '<span class="chip">Unidades <b>'+esc(r.unidades)+'</b></span>';
        if(r.art69) ch += '<span class="chip art">Art. 69 <b>'+esc(r.art69)+'</b></span>';
        if(r.temaeia) ch += '<span class="chip">Tema EIA <b>'+esc(r.temaeia)+'</b></span>';
        return '<div class="reg"><div class="num">'+(u.visor?'Capa ':'Registro ')+(k+1)+'</div><p>'+esc(r.d)+'</p>'+
               (ch?'<div class="chips">'+ch+'</div>':'')+'</div>';
      }).join('')
    : '<div class="vacio" style="margin-top:8px"><strong>Sin registros cargados</strong><span>El subtema está en el índice, pero su información sigue en identificación con el área responsable.</span></div>');
  $('cajon').classList.add('on'); $('fondo').classList.add('on');
  if(u.visor) iniciaVisor();
  $('cajon').setAttribute('aria-hidden','false');
  $('cerrar').focus();
}
function cerrarCajon(){
  $('cajon').classList.remove('on'); $('fondo').classList.remove('on');
  $('cajon').setAttribute('aria-hidden','true');
  if(ultimoFoco) ultimoFoco.focus();
}
$('cerrar').onclick = cerrarCajon;
$('fondo').onclick = cerrarCajon;
document.addEventListener('keydown', e => { if(e.key==='Escape') cerrarCajon(); });

/* ---------- navegación ---------- */
function irInicio(){ vista={n:0,sec:null,cad:null,tema:null}; $('q').value=''; render(); }
function irSector(i){ vista={n:1,sec:i,cad:null,tema:null}; $('q').value=''; render(); }
function irCadena(c){ vista.n=2; vista.cad=c; vista.tema=null; $('q').value=''; render(); }
function irTema(t){ const s=D[vista.sec]; vista.n=3; if(s.cadenas && vista.cad===null) vista.cad=0; vista.tema=t; $('q').value=''; render(); }
function irDestino(d){
  vista = {n:3, sec:d.si, cad:d.ci, tema:d.ti};
  $('q').value=''; render();
  if(d.ui!==undefined && d.ui!==null) abrirSub(d.ui);
}
$('inicio').onclick = irInicio;

function render(){
  cerrarCajon();
  pintarPestanas(); pintarMigas();
  if(vista.n===0) pintarPortada();
  else if(vista.n===1) pintarSector();
  else if(vista.n===2) pintarCadena();
  else pintarTema();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- búsqueda ---------- */
function recorrer(fn){
  D.forEach((s,si) => grupos(s).forEach((g,ci) => g.temas.forEach((t,ti) =>
    fn(s,si,g,s.cadenas?ci:null,t,ti))));
}
$('q').addEventListener('input', () => {
  const q = norm($('q').value.trim());
  if(q.length < 2){ if(vista.n===9) irInicio(); else render(); return; }
  vista.n = 9;
  pintarPestanas(); pintarMigas();
  const res = [];
  recorrer((s,si,g,ci,t,ti) => {
    const ruta = [s.nombre, g.nombre].filter(Boolean).join(' › ');
    if(norm(t.nombre).includes(q)) res.push({tipo:'Tema', nom:t.nombre, ruta, si, ci, ti});
    t.subs.forEach((u,ui) => {
      if(norm(u.nombre).includes(q)) res.push({tipo:'Subtema', nom:u.nombre, ruta:ruta+' › '+t.nombre, si, ci, ti, ui});
      u.regs.forEach(r => { if(norm(r.d).includes(q))
        res.push({tipo:'Registro', nom:r.d, ruta:ruta+' › '+t.nombre+' › '+u.nombre, si, ci, ti, ui}); });
    });
  });
  let h = '<div class="res"><h2>'+plural(res.length,'resultado','resultados')+'</h2>';
  h += res.length ? res.slice(0,120).map((r,i)=>'<button class="fila" data-i="'+i+'">'+
        '<div class="rn">'+esc(r.nom)+'</div><div class="rr"><span class="rt">'+r.tipo+'</span>'+esc(r.ruta)+'</div></button>').join('')
      : '<div class="sinres">No hay coincidencias en el índice.</div>';
  if(res.length>120) h += '<div class="sinres">Se muestran los primeros 120 resultados; acota la búsqueda.</div>';
  h += '</div>';
  $('lienzo').innerHTML = h;
  $('lienzo').querySelectorAll('.fila').forEach(f => f.onclick = () => irDestino(res[+f.dataset.i]));
});

/* ======================= GEOVISUALIZADOR DE CAPAS (AZEL) =======================
   Visor de demostración: el trazo del país es esquemático y los valores son
   ilustrativos. Está construido para que cada capa se sustituya después por los
   archivos reales del AZEL (.gpkg ráster y vectorial, .geojson por escenario). */

const MEX = [
 [[-114.75,32.30],[-111.05,31.33],[-108.21,31.33],[-108.21,31.78],[-106.53,31.78],[-105.00,30.60],
  [-104.40,29.55],[-103.00,28.95],[-102.30,29.85],[-101.40,29.75],[-100.65,29.05],[-99.50,27.60],
  [-98.20,26.05],[-97.15,25.95],[-97.45,25.00],[-97.75,23.80],[-97.80,22.30],[-97.05,21.10],
  [-96.35,19.85],[-95.20,18.70],[-94.40,18.15],[-92.80,18.55],[-91.50,18.70],[-90.70,19.30],
  [-90.35,20.40],[-90.05,21.10],[-88.60,21.60],[-87.45,21.55],[-86.80,20.90],[-87.05,20.00],
  [-87.45,19.30],[-88.05,18.55],[-88.90,17.90],[-89.15,17.95],[-90.99,17.82],[-91.45,17.25],
  [-90.45,16.07],[-91.75,15.05],[-92.23,14.53],[-93.60,15.70],[-94.80,16.20],[-96.10,15.70],
  [-97.30,15.90],[-98.60,16.30],[-99.90,16.75],[-101.20,17.30],[-103.00,18.30],[-104.30,19.10],
  [-105.20,19.90],[-105.70,20.50],[-105.30,21.50],[-105.70,22.30],[-106.40,23.20],[-107.60,24.50],
  [-108.90,25.60],[-109.35,26.35],[-109.10,27.10],[-110.60,27.90],[-112.20,28.90],[-113.10,31.00],
  [-114.72,31.75]],
 [[-117.12,32.53],[-116.05,30.80],[-115.30,28.90],[-114.30,27.85],[-112.90,26.00],[-112.10,24.60],
  [-110.10,23.10],[-109.70,23.45],[-110.50,24.35],[-111.10,25.60],[-112.10,27.10],[-113.60,29.60],
  [-114.72,31.75],[-114.80,32.50]]
];
const CAJA = {o:-118.6, e:-85.9, s:14.2, n:33.2};
const VW = 620, VH = 400;
const px = lo => (lo-CAJA.o)/(CAJA.e-CAJA.o)*VW;
const py = la => (CAJA.n-la)/(CAJA.n-CAJA.s)*VH;
const lonDe = x => CAJA.o + x/VW*(CAJA.e-CAJA.o);
const latDe = y => CAJA.n - y/VH*(CAJA.n-CAJA.s);

function dentro(lo,la){
  let d = false;
  for(const pol of MEX){
    let c = false;
    for(let i=0, j=pol.length-1; i<pol.length; j=i++){
      const [xi,yi]=pol[i], [xj,yj]=pol[j];
      if((yi>la)!==(yj>la) && lo < (xj-xi)*(la-yi)/(yj-yi)+xi) c = !c;
    }
    if(c) d = true;
  }
  return d;
}
const gauss = (lo,la,clo,cla,alo,ala) => Math.exp(-(((lo-clo)**2)/alo + ((la-cla)**2)/ala));
const ruido = (lo,la) => (Math.sin(lo*3.1+la*2.3)*0.5 + Math.sin(lo*7.7-la*5.1)*0.3 + Math.sin(la*11.3)*0.2)/2;

/* rampas de color */
const RAMPA_CALOR = [[0,'#2C3E8F'],[.2,'#1D9BC4'],[.4,'#3FB878'],[.6,'#E3D14B'],[.8,'#E88B2E'],[1,'#C0392B']];
const RAMPA_VIENTO = [[0,'#EDF3F7'],[.25,'#9FC7DE'],[.5,'#4E97C0'],[.75,'#235B8E'],[1,'#12213F']];
const RAMPA_BIOMASA = [[0,'#F3F0E4'],[.3,'#CBD98C'],[.6,'#7EB05A'],[.85,'#3E7A3A'],[1,'#1F4A24']];
const CLASES_HIDRICA = [
  {h:-1200,c:'#8B2F1F',t:'Déficit alto'}, {h:-500,c:'#C46A3E',t:'Déficit medio'},
  {h:-100,c:'#E8B978',t:'Déficit bajo'},  {h:100,c:'#F2EBD5',t:'Equilibrio'},
  {h:600,c:'#A8CFA0',t:'Superávit bajo'}, {h:1600,c:'#4E9E86',t:'Superávit medio'},
  {h:1e9,c:'#1F6F7A',t:'Superávit alto'}
];
function mezcla(rampa,t){
  t = Math.max(0, Math.min(1, t));
  for(let i=1;i<rampa.length;i++){
    if(t<=rampa[i][0]){
      const [a,ca]=rampa[i-1], [b,cb]=rampa[i];
      const f=(t-a)/(b-a||1);
      const h=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
      const A=h(ca), B=h(cb);
      return 'rgb('+A.map((v,k)=>Math.round(v+(B[k]-v)*f)).join(',')+')';
    }
  }
  return rampa[rampa.length-1][1];
}

/* sitios geotérmicos por escenario (subconjuntos de la faja volcánica) */
const GEO = [
  [-115.24,32.42],[-112.58,27.85],[-107.99,27.85],[-103.53,20.65],[-102.37,20.17],[-100.83,19.92],
  [-100.67,19.78],[-99.62,20.53],[-100.38,20.42],[-98.15,19.92],[-97.45,19.68],[-96.35,19.15],
  [-104.60,21.50],[-101.90,21.10],[-98.90,19.20],[-95.90,17.10],[-93.20,16.30],[-110.90,24.60],
  [-105.20,22.90],[-103.10,25.60],[-99.10,21.40],[-97.90,20.60],[-94.60,17.60],[-101.20,18.60]
];
function sitiosGeo(esc){
  const n = [12,18,24,20][esc], fuera = [];
  for(let i=0;i<n;i++){
    const b = GEO[i%GEO.length];
    const j = Math.floor(i/GEO.length);
    fuera.push([b[0] + j*0.9*Math.sin(i*2.7) , b[1] + j*0.7*Math.cos(i*1.9)]);
  }
  return fuera.filter(p=>dentro(p[0],p[1]));
}

const CAPAS = {
  solar:{
    nombre:'Potencial fotovoltaico', unidad:'kWh/kWp al día', rampa:RAMPA_CALOR, min:4.0, max:6.4,
    f:(lo,la)=> 4.2 + 1.9*gauss(lo,la,-109.5,28.0,120,70) + 1.1*gauss(lo,la,-103.0,23.5,90,50)
               + 0.5*gauss(lo,la,-98.5,19.5,60,30) - 0.9*gauss(lo,la,-92.0,17.5,60,30) + 0.18*ruido(lo,la)
  },
  radiacion:{
    nombre:'Radiación horizontal global', unidad:'kWh/m² al día', rampa:RAMPA_CALOR, min:4.4, max:7.0,
    f:(lo,la)=> 4.7 + 2.0*gauss(lo,la,-107.5,26.5,150,90) + 0.9*gauss(lo,la,-101.5,21.5,100,60)
               - 0.7*gauss(lo,la,-93.5,17.8,70,35) + 0.2*ruido(lo,la)
  },
  viento:{
    nombre:'Velocidad de viento', unidad:'m/s', rampa:RAMPA_VIENTO, min:2.5, max:11.5,
    variantes:{eti:'Altura de buje', ops:[['10','10 m',0.70],['50','50 m',0.88],['100','100 m',1.00],['150','150 m',1.07],['200','200 m',1.12]]},
    f:(lo,la,v)=> (3.2 + 6.4*gauss(lo,la,-94.6,16.5,3.5,1.6) + 2.6*gauss(lo,la,-115.6,30.6,6,5)
               + 2.2*gauss(lo,la,-98.2,24.4,10,8) + 1.9*gauss(lo,la,-101.8,22.8,14,9)
               + 1.6*gauss(lo,la,-88.6,21.0,8,4) + 0.35*ruido(lo,la)) * v
  },
  hidrica:{
    nombre:'Disponibilidad hídrica por cuenca', unidad:'hm³/año', clases:CLASES_HIDRICA, min:-2000, max:3000,
    f:(lo,la)=> -900 + 4200*gauss(lo,la,-92.5,17.6,20,10) + 2200*gauss(lo,la,-96.5,18.4,14,7)
               + 1400*gauss(lo,la,-99.0,21.0,18,12) + 900*gauss(lo,la,-105.0,20.5,14,9)
               - 700*gauss(lo,la,-104.0,27.5,60,40) + 260*ruido(lo,la)*3
  },
  biomasa:{
    nombre:'Biomasa', unidad:'PJ/año', rampa:RAMPA_BIOMASA, min:0, max:26,
    variantes:{eti:'Escenario', ops:[['for','Forestal',0],['ind','Industrial',1],['pec','Pecuaria',2],['urb','Urbana',3]]},
    f:(lo,la,v)=>{
      const c = [[-104.0,25.5],[-97.5,19.2],[-101.5,20.6],[-99.1,19.4]][v];
      const d = [[-92.6,17.2],[-93.5,17.8],[-103.2,21.4],[-103.3,20.7]][v];
      return 3 + 20*gauss(lo,la,c[0],c[1],36,20) + 14*gauss(lo,la,d[0],d[1],26,14) + 2.2*ruido(lo,la);
    }
  },
  geotermia:{
    nombre:'Geotermia', unidad:'sitios identificados', puntos:true,
    variantes:{eti:'Escenario', ops:[['e1','Escenario 1',0],['e2','Escenario 2',1],['e3','Escenario 3',2],['e4','Escenario 4',3]]}
  }
};

const V = {capa:'solar', variante:{}, opacidad:0.85, lienzo:null, mascara:null};

function dibujaVisor(){
  const cv = V.lienzo; if(!cv) return;
  const cx = cv.getContext('2d');
  const paso = 4;
  cx.clearRect(0,0,VW,VH);

  const trazo = () => {
    const p = new Path2D();
    MEX.forEach(pol => { pol.forEach((q,i) => i ? p.lineTo(px(q[0]),py(q[1])) : p.moveTo(px(q[0]),py(q[1]))); p.closePath(); });
    return p;
  };
  const pais = trazo();
  cx.fillStyle = '#ECE6E1'; cx.fill(pais);

  const capa = CAPAS[V.capa];
  if(!V.mascara){
    V.mascara = new Uint8Array(Math.ceil(VW/paso)*Math.ceil(VH/paso));
    let k = 0;
    for(let y=0;y<VH;y+=paso) for(let x=0;x<VW;x+=paso, k++)
      V.mascara[k] = dentro(lonDe(x+paso/2), latDe(y+paso/2)) ? 1 : 0;
  }

  if(!capa.puntos){
    const v = capa.variantes ? capa.variantes.ops.find(o=>o[0]===(V.variante[V.capa]||capa.variantes.ops[2]?.[0]||capa.variantes.ops[0][0]))?.[2] : null;
    cx.globalAlpha = V.opacidad;
    let k = 0;
    for(let y=0;y<VH;y+=paso) for(let x=0;x<VW;x+=paso, k++){
      if(!V.mascara[k]) continue;
      const val = capa.f(lonDe(x+paso/2), latDe(y+paso/2), v);
      cx.fillStyle = capa.clases
        ? (capa.clases.find(c=>val<=c.h)||capa.clases[capa.clases.length-1]).c
        : mezcla(capa.rampa, (val-capa.min)/(capa.max-capa.min));
      cx.fillRect(x,y,paso,paso);
    }
    cx.globalAlpha = 1;
  }

  cx.save(); cx.clip(pais); cx.restore();
  cx.lineWidth = 1.2; cx.strokeStyle = '#8A7E76'; cx.stroke(pais);

  if(capa.puntos){
    const esc = capa.variantes.ops.find(o=>o[0]===(V.variante.geotermia||'e1'))[2];
    const pts = sitiosGeo(esc);
    cx.globalAlpha = V.opacidad;
    pts.forEach(p => {
      cx.beginPath(); cx.arc(px(p[0]),py(p[1]),5.5,0,7);
      cx.fillStyle = '#C0392B'; cx.fill();
      cx.lineWidth = 1.4; cx.strokeStyle = '#FFFFFF'; cx.stroke();
    });
    cx.globalAlpha = 1;
    $('vconteo').textContent = pts.length + ' sitios en el escenario';
  } else {
    $('vconteo').textContent = '';
  }
  pintaLeyenda();
}

function pintaLeyenda(){
  const capa = CAPAS[V.capa];
  let h = '';
  if(capa.puntos){
    h = '<span class="vlg-pt"></span> Sitio con potencial geotérmico identificado';
  } else if(capa.clases){
    h = '<div class="vlg-cl">' + capa.clases.map(c=>'<span><i style="background:'+c.c+'"></i>'+c.t+'</span>').join('') + '</div>';
  } else {
    const grad = capa.rampa.map(r=>r[1]+' '+(r[0]*100)+'%').join(',');
    h = '<div class="vlg-b" style="background:linear-gradient(90deg,'+grad+')"></div>'+
        '<div class="vlg-t"><span>'+capa.min+'</span><span>'+capa.unidad+'</span><span>'+capa.max+'</span></div>';
  }
  $('vleyenda').innerHTML = h;
}

function controlesVisor(){
  const capa = CAPAS[V.capa];
  let h = '';
  if(capa.variantes){
    h += '<div class="vvar"><label for="vvarsel">'+capa.variantes.eti+'</label><select id="vvarsel">'+
      capa.variantes.ops.map(o=>'<option value="'+o[0]+'"'+((V.variante[V.capa]||'')===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
      '</select></div>';
  }
  h += '<div class="vvar"><label for="vop">Opacidad</label><input id="vop" type="range" min="20" max="100" value="'+Math.round(V.opacidad*100)+'"></div>';
  $('vcontroles').innerHTML = h;
  const sel = $('vvarsel');
  if(sel) sel.onchange = () => { V.variante[V.capa] = sel.value; dibujaVisor(); };
  $('vop').oninput = e => { V.opacidad = +e.target.value/100; dibujaVisor(); };
}

function htmlVisor(){
  return '<div class="visor">'+
    '<div class="vcapas">'+
      '<div class="vtit">Capas</div>'+
      Object.keys(CAPAS).map(k=>'<button class="vcapa'+(k===V.capa?' on':'')+'" data-k="'+k+'">'+CAPAS[k].nombre+'</button>').join('')+
      '<div id="vcontroles"></div>'+
    '</div>'+
    '<div class="vmapa">'+
      '<canvas id="vlienzo" width="'+VW+'" height="'+VH+'" role="img" aria-label="Mapa de la capa seleccionada"></canvas>'+
      '<div id="vleyenda" class="vleyenda"></div>'+
      '<div class="vpie"><span id="vlectura">Da clic en el mapa para consultar el valor de un punto.</span><span id="vconteo"></span></div>'+
    '</div></div>'+
    '<p class="vnota">Visor de demostración: el trazo del territorio es esquemático y los valores son ilustrativos. '+
    'Cada capa está preparada para sustituirse por los archivos reales del AZEL.</p>';
}

function iniciaVisor(){
  V.lienzo = $('vlienzo'); V.mascara = null;
  V.variante.viento = V.variante.viento || '100';
  V.variante.biomasa = V.variante.biomasa || 'for';
  V.variante.geotermia = V.variante.geotermia || 'e1';
  document.querySelectorAll('.vcapa').forEach(b => b.onclick = () => {
    V.capa = b.dataset.k;
    document.querySelectorAll('.vcapa').forEach(x=>x.classList.toggle('on', x===b));
    controlesVisor(); dibujaVisor();
  });
  V.lienzo.onclick = e => {
    const c = V.lienzo.getBoundingClientRect();
    const x = (e.clientX-c.left)*VW/c.width, y = (e.clientY-c.top)*VH/c.height;
    const lo = lonDe(x), la = latDe(y);
    const capa = CAPAS[V.capa];
    if(!dentro(lo,la)){ $('vlectura').textContent = 'Punto fuera del territorio nacional.'; return; }
    if(capa.puntos){ $('vlectura').textContent = 'Capa de puntos: ' + $('vconteo').textContent + '.'; return; }
    const v = capa.variantes ? capa.variantes.ops.find(o=>o[0]===V.variante[V.capa])[2] : null;
    const val = capa.f(lo,la,v);
    $('vlectura').textContent = capa.nombre + ': ' + (Math.abs(val)>=100 ? Math.round(val) : val.toFixed(2)) +
      ' ' + capa.unidad + '  ·  ' + Math.abs(la).toFixed(2) + '° N, ' + Math.abs(lo).toFixed(2) + '° O';
  };
  controlesVisor(); dibujaVisor();
}

$('logotira').src = IMG.sener;
render();
</script>
